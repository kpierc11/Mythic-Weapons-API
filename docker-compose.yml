services:
  backend:
    build:
      context: backend
      target: builder
  db:
  
    #If you really want to use MySQL, uncomment the following line
    image: mysql:8
  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
    - 80:80